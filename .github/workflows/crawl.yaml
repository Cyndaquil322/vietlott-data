name: Vietlott Daily Crawler & Web Deploy

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  schedule:
    # 1. Runs at 06:35 UTC (13:35 VN time - Immediately after Power 5/35 13:00 midday draw)
    - cron: '35 6 * * *'
    # 2. Runs at 11:45 UTC (18:45 VN time - Immediately after Power 6/55 & Mega 6/45 18:00 draws)
    - cron: '45 11 * * *'
    # 3. Runs at 14:35 UTC (21:35 VN time - Immediately after Power 5/35 21:00 evening draw)
    - cron: '35 14 * * *'
    # 4. Runs at 05:00 UTC (12:00 VN time - Midday sync check)
    - cron: '0 5 * * *'

# Grant permission to commit and push updates back to the repo
permissions:
  contents: write

jobs:
  crawl_and_update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crawler & Update Data Pipeline
        run: |
          chmod +x ./bin/github_data.sh
          bash ./bin/github_data.sh
