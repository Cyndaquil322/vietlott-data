name: Vietlott Daily Crawler & Web Deploy

'on':
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/**'
      - 'bin/**'
      - '.github/workflows/**'
      - 'index.html'
      - 'assets/**'
  schedule:
    # =========================================================================
    # LỊCH CHẠY TỰ ĐỘNG THEO GIỜ VIỆT NAM (UTC+7)
    # =========================================================================
    # 1. KỲ TRƯA POWER 5/35 (Quay lúc 13:00 VN = 06:00 UTC)
    - cron: '20 6 * * *'   # 13:20 VN (Quét sớm ngay khi vừa có kết quả)
    - cron: '35 6 * * *'   # 13:35 VN (Quét chính thức đầy đủ)
    - cron: '5 7 * * *'    # 14:05 VN (Quét dự phòng nếu máy chủ Vietlott bị trễ)

    # 2. KỲ CHIỀU POWER 6/55 & MEGA 6/45 & MAX 3D (Quay lúc 18:00 - 18:30 VN = 11:00 UTC)
    - cron: '35 11 * * *'  # 18:35 VN (Quét sớm)
    - cron: '50 11 * * *'  # 18:50 VN (Quét chính thức)
    - cron: '15 12 * * *'  # 19:15 VN (Quét an toàn)
    - cron: '0 13 * * *'   # 20:00 VN (Chốt kết quả buổi tối)

    # 3. KỲ TỐI POWER 5/35 (Quay lúc 21:00 VN = 14:00 UTC)
    - cron: '20 14 * * *'  # 21:20 VN (Quét sớm)
    - cron: '35 14 * * *'  # 21:35 VN (Quét chính thức)
    - cron: '5 15 * * *'   # 22:05 VN (Quét dự phòng)

    # 4. CHÀO NGÀY MỚI & TRƯỚC GIỜ QUAY TRƯA
    - cron: '0 23 * * *'   # 06:00 VN (Đồng bộ tươi mới đầu ngày)
    - cron: '30 4 * * *'   # 11:30 VN (Kiểm tra trước kỳ quay trưa)

# Grant permissions to write repo contents and deploy to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "vietlott-crawler-deploy"
  cancel-in-progress: false

jobs:
  crawl_and_update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crawler & Update Data Pipeline
        run: |
          chmod +x ./bin/github_data.sh
          bash ./bin/github_data.sh

  deploy_pages:
    needs: crawl_and_update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
