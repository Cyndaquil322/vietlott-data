name: Vietlott Daily Crawler & Web Deploy

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  schedule:
    # 1. Evening Draw Window (Power 6/55, Mega 6/45 drawn ~18:00 - 18:30 VN time)
    #    Multiple sync attempts guarantee we never miss results if Vietlott website is delayed
    - cron: '35 11 * * *'  # 18:35 VN (Early check)
    - cron: '50 11 * * *'  # 18:50 VN (Prime check)
    - cron: '15 12 * * *'  # 19:15 VN (Safety backup check)
    - cron: '0 13 * * *'   # 20:00 VN (Final evening verification)

    # 2. Night Draw Window (Power 5/35 evening draw ~21:00 VN time)
    - cron: '35 14 * * *'  # 21:35 VN (Prime check)
    - cron: '15 15 * * *'  # 22:15 VN (Backup check)

    # 3. Midday Draw Window (Power 5/35 midday draw ~13:00 VN time)
    - cron: '35 6 * * *'   # 13:35 VN (Prime check)
    - cron: '15 7 * * *'   # 14:15 VN (Backup check)

    # 4. Morning & Pre-draw Freshness checks
    - cron: '30 22 * * *'  # 05:30 VN (Early morning fresh check)
    - cron: '30 4 * * *'   # 11:30 VN (Pre-midday check)

# Grant permission to commit and push updates back to the repo
permissions:
  contents: write

jobs:
  crawl_and_update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crawler & Update Data Pipeline
        run: |
          chmod +x ./bin/github_data.sh
          bash ./bin/github_data.sh
